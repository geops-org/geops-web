<!--
  LoginComponent Template
  Displays a user login form with translated labels, register link, and error feedback.
-->

<div class="login-container">
  <!-- Language switcher for multilingual support -->
  <div class="login-language-switch">
    <app-language-switcher />
  </div>

  <!-- Form title, translated -->
  <h2 class="login-title">{{ 'login.title' | translate }}</h2>

  <!-- User login form -->
  <form class="login-form" (ngSubmit)="onSubmit()" #loginForm="ngForm">

    <!-- Email input -->
    <label class="login-label">{{ 'login.email' | translate }}</label>
    <input
      class="login-input"
      [class.login-input--error]="fieldErrors.email"
      type="email"
      name="email"
      [(ngModel)]="model.email"
      (ngModelChange)="onFieldChange('email')"
      required
    />
    <span class="login-field-error" *ngIf="fieldErrors.email">
      {{ fieldErrors.email }}
    </span>

    <!-- Password input -->
    <label class="login-label">{{ 'login.password' | translate }}</label>
    <div class="login-input-wrapper">
      <input
        class="login-input"
        [class.login-input--error]="fieldErrors.password"
        [type]="showPassword ? 'text' : 'password'"
        name="password"
        [(ngModel)]="model.password"
        (ngModelChange)="onFieldChange('password')"
        required
      />
      <button
        type="button"
        class="login-eye-btn"
        (click)="togglePassword()"
        [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
      >
    <!-- Ojo abierto -->
    <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="22" height="22"
      viewBox="0 0 24 24" fill="none" stroke="#9b8ec4" stroke-width="2.2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
      <circle cx="12" cy="12" r="3.2"/>
    </svg>

    <!-- Ojo cerrado -->
    <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="22" height="22"
      viewBox="0 0 24 24" fill="none" stroke="#9b8ec4" stroke-width="2.2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20C5 20 2 12 2 12a18 18 0 0 1 5.06-5.94"/>
      <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19"/>
      <line x1="2" y1="2" x2="22" y2="22"/>
    </svg>
  </button>
    </div>
    <span class="login-field-error" *ngIf="fieldErrors.password">
      {{ fieldErrors.password }}
    </span>

    <!-- Submit button, disabled while loading -->
    <button class="login-btn" type="submit" [disabled]="loading">
      <span *ngIf="!loading">{{ 'login.button' | translate }}</span>
      <span *ngIf="loading">{{ 'login.loading' | translate }}</span>
    </button>

  </form>

  <!-- Register link for users who do not have an account -->
  <p class="login-register-msg">
    {{ 'login.noAccount' | translate }}
    <a class="login-register-link" [routerLink]="['/register']">
      {{ 'login.register' | translate }}
    </a>
  </p>

  <!-- Error message display (errores generales: 401, 500, sin conexión) -->
  <div *ngIf="errorMessage" class="login-error">{{ errorMessage }}</div>
</div>
