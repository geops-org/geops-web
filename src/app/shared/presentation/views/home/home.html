<div class="layout">
  <section class="map-container">

    <div class="map-categories">
      <button class="map-cat" [class.active]="isDistrictActive('all')" (click)="selectDistrict('all')">All</button>
      <button class="map-cat" [class.active]="isDistrictActive('san borja')" (click)="selectDistrict('san borja')">San Borja</button>
      <button class="map-cat" [class.active]="isDistrictActive('lince')" (click)="selectDistrict('lince')">Lince</button>
      <button class="map-cat" [class.active]="isDistrictActive('barrio chino')" (click)="selectDistrict('barrio chino')">Barrio Chino</button>
    </div>

    <div class="map">
      <div class="map-card">
        <div class="map-image">
          <div #mapEl class="map-leaflet"></div>
        </div>
      </div>

      <div class="info-card">
        <div class="info-card-header">
          <h3 class="info-card-title">{{'home.map.nearby-offers' | translate}}</h3>
          <span class="info-card-count">{{filteredDisplayOffers().length}} {{'home.map.results' | translate}}</span>
        </div>
        <div class="offer-map-list">
          @for(offer of filteredDisplayOffers(); track offer.id) {
            <div class="offer-loc-item"
                 [routerLink]="['/ofertas', offer.id]"
                 (click)="onViewOffer(offer)">
              <div class="offer-loc-info">
                <h4 class="offer-loc-title">{{offer.title}}</h4>
                <p class="offer-loc-partner">{{offer.partner}}</p>
                <p class="offer-loc-location">📍 {{offer.location}}</p>
              </div>
              <div class="offer-loc-price">
                <span class="offer-loc-currency">S/</span>
                <span class="offer-loc-amount">{{offer.price | number:'1.2-2'}}</span>
              </div>
            </div>
          }
        </div>
      </div>
    </div>

  </section>
</div>
